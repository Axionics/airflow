name: Deploy Airflow

on:
  push:
    branches: [main]
    paths:
      - 'dags/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64, airflow]

    steps:
      - name: Pull latest code
        run: |
          cd /opt/airflow
          git fetch origin main
          git reset --hard origin/main

      - name: Rebuild image if Dockerfile or requirements changed
        run: |
          cd /opt/airflow
          CHANGED=$(git diff --name-only HEAD@{1} HEAD 2>/dev/null || echo "")
          echo "Arquivos alterados: $CHANGED"
          if echo "$CHANGED" | grep -qE '^(Dockerfile|requirements\.txt)'; then
            echo "Reconstruindo imagem Docker..."
            docker compose build --no-cache
            docker compose up -d
          else
            echo "Sem mudança de imagem — deploy via git pull concluído."
          fi
